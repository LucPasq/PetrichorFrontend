<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Petrichor</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="container">
    <div class="logo">Petrichor</div>
    <div class="subtitle">Predict rainfall for any location and date</div>
    <form [formGroup]="rainForm" (ngSubmit)="onSubmit()">
      <ion-item>
        <ion-label position="stacked">Date</ion-label>
        <ion-input type="date" formControlName="date" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Town or City Name</ion-label>
        <ion-input type="text" formControlName="location" placeholder="e.g. Toronto" required></ion-input>
      </ion-item>
      <ion-button expand="block" type="submit" [disabled]="rainForm.invalid || loading">Show Rainfall Prediction</ion-button>
    </form>
    <div *ngIf="loading" style="width:100%;margin:20px 0;">
      <ion-progress-bar [value]="progress/100" color="primary"></ion-progress-bar>
      <div style="text-align:right;color:#1769aa;font-weight:600;margin-top:4px;">{{progress}}%</div>
    </div>
    <ion-card *ngIf="finalResult" color="primary" style="margin:22px 0 10px 0;">
      <ion-card-content [innerHTML]="finalResult"></ion-card-content>
    </ion-card>
    <div id="result" *ngIf="result" style="margin:8px 0 8px 0; font-size:1rem; background:#e3f2fd; border-radius:5px; padding:7px 12px;">
      <div [innerHTML]="result"></div>
    </div>
  </div>
</ion-content>
